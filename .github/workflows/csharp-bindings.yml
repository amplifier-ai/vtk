name: C# Bindings

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VTK_VERSION: "9.6"
  DOTNET_VERSION: "8.0"
  CMAKE_BUILD_PARALLEL_LEVEL: 8
  CCACHE_MAXSIZE: 2G
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_VERSION: '4.14.1'
  SDK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            artifact_ext: dll
            archive: zip
          - os: macos-14-xlarge
            platform: osx-arm64
            artifact_ext: dylib
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SDK_SOURCE_SHA }}
          persist-credentials: false
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ runner.os == 'Windows' && 'x64' || 'arm64' }}

      - name: Check storage reserve and additional peak
        id: preflight
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --peak-gib 15

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install matching build tools
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 600 --
          python -m pip install cmake==4.0.3 ninja==1.11.1.4

      - name: Install verified compiler cache
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import urllib.request
          import zipfile

          version = os.environ['CCACHE_VERSION']
          if sys.platform == 'win32':
              name = f'ccache-{version}-windows-x86_64.zip'
              expected = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
              binary = 'ccache.exe'
          else:
              name = f'ccache-{version}-darwin.tar.gz'
              expected = 'c279fa81e2e806b4d9e64d4a06cb569a84ef54151feef796e5d4f4e95a464563'
              binary = 'ccache'
          tools = Path(os.environ['RUNNER_TEMP']) / 'shared-vtk-ccache'
          tools.mkdir()
          archive = tools / name
          url = f'https://github.com/ccache/ccache/releases/download/v{version}/{name}'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive.write_bytes(response.read())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Compiler cache archive digest mismatch')
          if name.endswith('.zip'):
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(tools)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(tools, filter='data')
          executable, = (path for path in tools.rglob(binary) if path.is_file())
          subprocess.run([str(executable), '--version'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(executable.parent) + '\n')

      # ── Caching ──
      - name: Cache ccache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: shared-vtk-ccache-v1-${{ matrix.platform }}-${{ hashFiles('.github/sdk/native-sdk.cmake', '.github/workflows/csharp-bindings.yml') }}-${{ env.CCACHE_VERSION }}-${{ env.SDK_SOURCE_SHA }}
          restore-keys: |
            shared-vtk-ccache-v1-${{ matrix.platform }}-${{ hashFiles('.github/sdk/native-sdk.cmake', '.github/workflows/csharp-bindings.yml') }}-${{ env.CCACHE_VERSION }}-
            shared-vtk-ccache-v1-${{ matrix.platform }}-
            ccache-${{ matrix.platform }}-

      - name: Record and reset compiler cache counters
        shell: bash
        run: |
          mkdir -p .sdk-evidence
          ccache --version | tee .sdk-evidence/ccache-version.txt
          ccache --show-config | tee .sdk-evidence/ccache-config.txt
          ccache --show-stats --verbose | tee .sdk-evidence/ccache-before.txt
          ccache --zero-stats

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-win-x64-${{ hashFiles('.github/workflows/csharp-bindings.yml') }}
          restore-keys: |
            vcpkg-win-x64-

      - name: Cache Homebrew (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: brew-osx-arm64-${{ hashFiles('.github/workflows/csharp-bindings.yml') }}
          restore-keys: |
            brew-osx-arm64-

      # ── Windows dependencies ──
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows `
            openxr-loader `
            ffmpeg `
            boost-graph `
            freeglut `
            libarchive

      # ── macOS dependencies ──
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg hdf5 boost onnxruntime libarchive
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libarchive)" >> "$GITHUB_ENV"

      - name: Request CMake installable target graph
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 60 --
          python .github/sdk/build_installable.py --build build --prepare

      # ── CMake Configure ──
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 900 -- `
            cmake -G Ninja -B build -C .github/sdk/native-sdk.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/sdk" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DVTK_INSTALL_SDK=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVTK_WRAP_CSHARP=ON `
            -DVTK_BUILD_TESTING=ON `
            -DVTK_DATA_EXCLUDE_FROM_ALL=ON `
            -DVTK_MODULE_ENABLE_VTK_RenderingOpenXR=YES `
            -DVTK_MODULE_ENABLE_VTK_RenderingOpenXRRemoting=NO `
            -DVTK_MODULE_ENABLE_VTK_RenderingVR=YES `
            -DVTK_MODULE_ENABLE_VTK_IOFFMPEG=YES `
            -DVTK_MODULE_ENABLE_VTK_RenderingFFMPEGOpenGL2=YES `
            -DVTK_MODULE_ENABLE_VTK_IOGeoJSON=YES `
            -DVTK_MODULE_ENABLE_VTK_IOLAS=NO `
            -DVTK_MODULE_ENABLE_VTK_IOH5part=NO `
            -DVTK_MODULE_ENABLE_VTK_IOXdmf3=NO `
            -DVTK_MODULE_ENABLE_VTK_ImagingOpenGL2=YES `
            -DVTK_MODULE_ENABLE_VTK_RenderingVolumeAMR=YES `
            -DVTK_MODULE_ENABLE_VTK_RenderingExternal=YES `
            -DVTK_MODULE_ENABLE_VTK_FiltersReebGraph=YES `
            -DVTK_MODULE_ENABLE_VTK_InfovisBoostGraphAlgorithms=YES `
            -DVTK_MODULE_ENABLE_VTK_SerializationManager=YES `
            -DVTK_MODULE_ENABLE_VTK_CommonArchive=YES `
            -DVTK_MODULE_ENABLE_VTK_DomainsMicroscopy=NO `
            -DVTK_MODULE_ENABLE_VTK_IOOMF=YES `
            -DVTK_MODULE_ENABLE_VTK_WebGLExporter=YES `
            -DVTK_MODULE_ENABLE_VTK_TestingSerialization=YES

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 900 -- \
            cmake -G Ninja -B build -C .github/sdk/native-sdk.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdk" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DVTK_USE_COCOA=ON \
            -DVTK_USE_X=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DVTK_INSTALL_SDK=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DVTK_WRAP_CSHARP=ON \
            -DVTK_BUILD_TESTING=ON \
            -DVTK_DATA_EXCLUDE_FROM_ALL=ON \
            -DVTK_MODULE_ENABLE_VTK_IOFFMPEG=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingFFMPEGOpenGL2=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeoJSON=YES \
            -DVTK_MODULE_ENABLE_VTK_IOLAS=NO \
            -DVTK_MODULE_ENABLE_VTK_IOH5part=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXdmf3=YES \
            -DVTK_MODULE_ENABLE_VTK_ImagingOpenGL2=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingVolumeAMR=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingExternal=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersReebGraph=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersONNX=YES \
            -DVTK_MODULE_ENABLE_VTK_InfovisBoostGraphAlgorithms=YES \
            -DVTK_MODULE_ENABLE_VTK_SerializationManager=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonArchive=YES \
            -DVTK_MODULE_ENABLE_VTK_DomainsMicroscopy=NO \
            -DVTK_MODULE_ENABLE_VTK_IOOMF=YES \
            -DVTK_MODULE_ENABLE_VTK_WebGLExporter=YES \
            -DVTK_MODULE_ENABLE_VTK_TestingSerialization=YES

      # ── Build ──
      - name: Build
        id: native_build
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 12600 --
          cmake --build build --config Release --target VTKCSharpAssembly VTKCSharpTests

      - name: Complete remaining SDK installable targets
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 12600 --
          python .github/sdk/build_installable.py --build build

      - name: Preserve successful compilation cache
        if: always() && steps.native_build.outcome == 'success' && steps.compiler_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

      - name: Print ccache stats
        if: always() && steps.compiler_cache.outcome == 'success'
        shell: bash
        run: ccache --show-stats --verbose | tee .sdk-evidence/ccache-after.txt

      # ── Test ──
      - name: Run C# tests
        working-directory: build
        run: ctest -C Release -R vtkCSharpTests --output-on-failure --timeout 120

      - name: Install SDK from shared build
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 900 --
          cmake --install build --config Release --prefix sdk

      - name: Package SDK
        shell: bash
        run: >-
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 900 --
          python .github/sdk/package_sdk.py --sdk sdk --build build --source .
          --platform ${{ matrix.platform }} --output packages

      - name: Verify relocated SDK consumer
        id: verification
        shell: bash
        run: |
          python .github/sdk/run_guarded.py --path . --reserve-gib 20 --timeout 1200 -- \
            python .github/sdk/verify_sdk.py \
              --archive packages/vtk-sdk-${{ matrix.platform }}.${{ matrix.archive }} \
              --consumer .github/sdk/consumer \
              --work "$RUNNER_TEMP/vtk-sdk-relocated" --original-sdk sdk \
            2>&1 | tee .sdk-evidence/verification.log

      - name: Preserve consumer verification report
        if: always() && steps.preflight.outcome != 'skipped'
        shell: python
        env:
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          import os
          from pathlib import Path
          import shutil

          report = Path(os.environ['RUNNER_TEMP']) / 'vtk-sdk-relocated' / 'verification.json'
          if report.is_file():
              shutil.copyfile(report, Path('.sdk-evidence') / 'verification.json')
          elif os.environ['VERIFICATION_OUTCOME'] == 'success':
              raise SystemExit('Successful consumer verification did not produce its report')

      - name: Upload verified SDK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: vtk-sdk-package-${{ matrix.platform }}
          path: |
            packages/vtk-sdk-${{ matrix.platform }}.${{ matrix.archive }}
            packages/vtk-sdk-${{ matrix.platform }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload storage and verification evidence
        if: always() && steps.preflight.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: vtk-sdk-evidence-${{ matrix.platform }}
          path: .sdk-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # ── Package artifacts ──
      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native
          New-Item -ItemType Directory -Force -Path artifacts/managed

          # Native CSharp libraries
          Copy-Item build/bin/Release/*CSharp*.dll artifacts/native/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/*CSharp*.dll artifacts/native/ -ErrorAction SilentlyContinue
          Copy-Item build/lib/csharp/*CSharp*.dll artifacts/native/ -ErrorAction SilentlyContinue

          # VTK core native libraries (needed at runtime)
          Copy-Item build/bin/Release/vtk*.dll artifacts/native/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/vtk*.dll artifacts/native/ -ErrorAction SilentlyContinue

          # Managed assembly (dotnet build -o places it in lib/)
          Copy-Item build/lib/VTK.CSharp.dll artifacts/managed/

          # Summary
          Write-Host "Native libraries: $((Get-ChildItem artifacts/native/*.dll).Count)"
          Write-Host "Managed assembly: $((Get-ChildItem artifacts/managed/*.dll).Count)"

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/native artifacts/managed

          # Native CSharp libraries
          cp build/lib/csharp/*CSharp*.dylib artifacts/native/ 2>/dev/null || true
          cp build/lib/*CSharp*.dylib artifacts/native/ 2>/dev/null || true

          # VTK core native libraries (needed at runtime)
          cp build/lib/libvtk*.dylib artifacts/native/ 2>/dev/null || true

          # Managed assembly (dotnet build -o places it in lib/)
          cp build/lib/VTK.CSharp.dll artifacts/managed/

          # Summary
          shopt -s nullglob
          native_libraries=(artifacts/native/*.dylib)
          managed_assemblies=(artifacts/managed/*.dll)
          echo "Native libraries: ${#native_libraries[@]}"
          echo "Managed assembly: ${#managed_assemblies[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtk-csharp-${{ matrix.platform }}
          path: artifacts/
          retention-days: 30

  sdk_unit:
    name: SDK packaging unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SDK_SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s .github/sdk/tests -v

  sdk_publication:
    name: Publish native SDK
    needs: [build, sdk_unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/native-sdk.yml
    with:
      source_sha: ${{ github.sha }}

  # ── Release (master) ──
  # After successful build on master, create a stable release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    name: Create release
    permissions:
      contents: write

    steps:
      - name: Generate tag
        id: tag
        run: echo "tag=v$(date -u +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: vtk-csharp-win-x64
          path: vtk-csharp-win-x64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: vtk-csharp-osx-arm64
          path: vtk-csharp-osx-arm64

      - name: Create archives
        run: |
          cd vtk-csharp-win-x64 && zip -r ../vtk-csharp-win-x64.zip . && cd ..
          cd vtk-csharp-osx-arm64 && tar czf ../vtk-csharp-osx-arm64.tar.gz . && cd ..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ env.SDK_SOURCE_SHA }}
          name: VTK C# Bindings ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            vtk-csharp-win-x64.zip
            vtk-csharp-osx-arm64.tar.gz
