name: Native SDK publication

on:
  workflow_call:
    inputs:
      source_sha:
        description: Source commit used to build the SDK artifacts in the calling run
        required: true
        type: string
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Token for the native unity-plugin project's VTK Sentry releases and PDB/dSYM files
        required: true

permissions:
  contents: write

env:
  SDK_SOURCE_SHA: ${{ inputs.source_sha }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish validated SDK
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout validated master source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download verified SDK packages
        uses: actions/download-artifact@v4
        with:
          pattern: vtk-sdk-package-*
          path: packages
          merge-multiple: true

      - name: Download Windows evidence
        uses: actions/download-artifact@v4
        with:
          name: vtk-sdk-evidence-win-x64
          path: evidence/win-x64

      - name: Download macOS evidence
        uses: actions/download-artifact@v4
        with:
          name: vtk-sdk-evidence-osx-arm64
          path: evidence/osx-arm64

      - name: Download Windows native symbols
        uses: actions/download-artifact@v4
        with:
          name: vtk-sentry-win-x64
          path: symbols/win-x64

      - name: Download macOS native symbols
        uses: actions/download-artifact@v4
        with:
          name: vtk-sentry-osx-arm64
          path: symbols/osx-arm64

      - name: Download matching CSharp archive identities
        uses: actions/download-artifact@v4
        with:
          pattern: vtk-csharp-*
          path: runtime-packages
          merge-multiple: true

      - name: Validate asset checksums and collect evidence
        run: |
          python .github/sdk/validate_release.py \
            --packages packages --evidence evidence --source-sha "$SDK_SOURCE_SHA"
          for platform in win-x64 osx-arm64; do
            test -s "evidence/$platform/verification.json"
            tar -czf "packages/vtk-sdk-evidence-$platform.tar.gz" -C "evidence/$platform" .
            (cd packages && sha256sum "vtk-sdk-evidence-$platform.tar.gz" \
              > "vtk-sdk-evidence-$platform.tar.gz.sha256")
          done

      - name: Install verified Sentry publisher CLI
        id: sentry_cli
        run: >-
          python .github/sdk/install_sentry_cli.py
          --directory "$RUNNER_TEMP/vtk-sentry-cli" --platform linux-x64

      - name: Publish VTK Sentry release and PDB/dSYM files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CLI: ${{ steps.sentry_cli.outputs.path }}
        run: >-
          python .github/sdk/publish_sentry.py
          --roots symbols/win-x64 symbols/osx-arm64 --source-sha "$SDK_SOURCE_SHA"
          --packages packages --runtime-packages runtime-packages
          --release "vtk-sdk@9.7.1+$SDK_SOURCE_SHA.run-$GITHUB_RUN_ID"
          --sentry-cli "$SENTRY_CLI" --receipt packages/vtk-sentry-publication.json

      - name: Preserve Sentry publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtk-sentry-publication-receipt
          path: |
            packages/vtk-sentry-publication.json
          if-no-files-found: error
          retention-days: 30

      - name: Create unique release with source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'push' ] || [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo "SDK publication requires a successful push build of master" >&2
            exit 1
          fi
          tag="vtk-sdk-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq 'length')
          if [ "$existing" -ne 0 ]; then
            echo "Refusing to reuse existing SDK tag: $tag" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SDK_SOURCE_SHA']
          run = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          Path('release-notes.md').write_text(
              'Native C++ SDK for win-x64 and osx-arm64.\n\n'
              f'Source commit: [{source}](https://github.com/{repository}/commit/{source}).\n\n'
              'Release branch: `master`.\n\n'
              f'Workflow run: https://github.com/{repository}/actions/runs/{run}/attempts/{attempt}.\n\n'
              'Both SDKs passed installation, archive validation, and a consumer build and test '
              'after relocation and removal of the original install. SHA256 files and verification '
              'evidence are included.\n',
              encoding='utf-8',
          )
          PY
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" \
            --target "$SDK_SOURCE_SHA" --title "VTK Native SDK $tag" \
            --notes-file release-notes.md --latest=false
